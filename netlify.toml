[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["content/library/**", "content/quests/**"]

# Required environment variables (set in Netlify: Site configuration ->
# Environment variables — never commit real values):
#   STRIPE_SECRET_KEY     live secret key for the Co.LLab™ Stripe account
#   STRIPE_WEBHOOK_SECRET signing secret for the "The Co.LLab website" webhook
#                         endpoint (Stripe dashboard -> Developers -> Webhooks)
#   ADMIN_TOKEN           bearer token the owner uses to sign in at /admin/customers.html
#                         (also gates admin-test-checkout.js's $1 test purchases)
#
# Optional environment variables:
#   DEV_SETUP_SECRET      gates dev-setup-test-account.js's one-tap sample account
#   SMTP_USER + SMTP_PASS purchase confirmation emails (lib/mailer.js): the sending
#                         account and its app password (Gmail: Google Account ->
#                         Security -> App passwords). Until set, emails are skipped.
#   SMTP_HOST / SMTP_PORT optional, default smtp.gmail.com / 465
#   EMAIL_FROM            optional sender, default "The Co.LLab™ <SMTP_USER>"
#   STRIPE_SECRET_KEY_TEST + STRIPE_TEST_PRICE_MAP  enable true Stripe TEST MODE
#                         (zero real charges) for admin-test-checkout.js once the
#                         owner has mirrored a price in Stripe test mode; until
#                         set, test purchases use a real $1 charge via a hidden,
#                         single-use coupon on the live price instead.

[[headers]]
  for = "/content/*.json"
  [headers.values]
    Cache-Control = "no-cache"

# Search indexing: keep member, admin, and raw CMS/library files out of Google.
# Public pages rank instead; the free-tool PDFs stay downloadable from them.
[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/marketing/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pages/account.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/pages/login.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/pages/library.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/login"
  to = "/pages/login.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/pages/account.html"
  status = 200

[[redirects]]
  from = "/library-card"
  to = "/pages/products.html#library-card"
  status = 301

[[redirects]]
  from = "/membership"
  to = "/pages/products.html#membership"
  status = 301

[[redirects]]
  from = "/impact"
  to = "/pages/impact.html"
  status = 200

# Digital business card: "Add to contacts" downloads a vCard.
[[headers]]
  for = "/ashley-clasby.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=\"ashley-clasby.vcf\""

[[redirects]]
  from = "/STRATEGY.md"
  to = "/404.html"
  status = 404
  force = true

