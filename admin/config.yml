backend:
  name: github
  repo: letsbuildleadership-ship-it/the-collab
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: "/"
display_url: "/"

collections:
  - name: "site"
    label: "Site-wide"
    files:
      - name: "settings"
        label: "Global Settings"
        file: "content/site.json"
        fields:
          - { label: "Logo", name: "logo_src", widget: "image" }
          - { label: "Banner text", name: "banner_text", widget: "string" }
          - { label: "Banner button label", name: "banner_cta_label", widget: "string" }
          - { label: "Banner button link", name: "banner_cta_link", widget: "string" }
          - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
          - { label: "Contact email", name: "contact_email", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/home.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: &headline_segment_fields
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Color", name: "style", widget: "select", options: ["default", "white", "glow"], default: "default" }
              - { label: "Line break before this", name: "break_before", widget: "boolean", default: false }
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }
          - { label: "Primary button label", name: "hero_cta_primary_label", widget: "string" }
          - { label: "Primary button link", name: "hero_cta_primary_link", widget: "string" }
          - { label: "Secondary button label", name: "hero_cta_secondary_label", widget: "string" }
          - { label: "Secondary button link", name: "hero_cta_secondary_link", widget: "string" }

          - { label: "Doorway eyebrow", name: "doorway_eyebrow", widget: "string" }
          - { label: "Doorway headline", name: "doorway_headline", widget: "text" }
          - { label: "Doorway body", name: "doorway_body", widget: "text" }

          - { label: "Ecosystem eyebrow", name: "directory_eyebrow", widget: "string" }
          - label: "Ecosystem cards"
            name: "directory_cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Mission eyebrow", name: "mission_eyebrow", widget: "string" }
          - label: "Mission quote"
            name: "mission_quote"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Mission body", name: "mission_body", widget: "text" }
          - label: "Mission stats"
            name: "mission_stats"
            widget: "list"
            summary: "{{fields.number}} — {{fields.label}}"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

          - { label: "Phases eyebrow", name: "phases_eyebrow", widget: "string" }
          - label: "The four phases"
            name: "phases"
            widget: "list"
            summary: "{{fields.title}}"
            fields: &title_description_fields
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - { label: "Omnidirectional Enterprise eyebrow", name: "omni_eyebrow", widget: "string" }
          - { label: "Omnidirectional Enterprise headline", name: "omni_headline", widget: "string" }
          - { label: "Omnidirectional Enterprise body", name: "omni_body", widget: "text" }
          - label: "Value-flow words"
            name: "omni_flow"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Word", name: "label", widget: "string" }

          - { label: "Vision eyebrow", name: "vision_eyebrow", widget: "string" }
          - label: "Vision headline"
            name: "vision_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Vision body (base text)", name: "vision_body_prefix", widget: "text" }
          - { label: "Vision body (glow word)", name: "vision_body_glow", widget: "string" }

          - { label: "Offer eyebrow", name: "offer_eyebrow", widget: "string" }
          - label: "Offer headline"
            name: "offer_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Offer body", name: "offer_body", widget: "text" }
          - { label: "Offer button label", name: "offer_cta_label", widget: "string" }
          - { label: "Offer button link", name: "offer_cta_link", widget: "string" }

      - name: "founders"
        label: "Build (Founders)"
        file: "content/founders.json"
        fields:
          - { label: "Banner text", name: "banner_text", widget: "string" }
          - { label: "Banner highlight (glow)", name: "banner_highlight", widget: "string" }
          - { label: "Banner button label", name: "banner_cta_label", widget: "string" }
          - { label: "Banner button link", name: "banner_cta_link", widget: "string" }

          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead (base text)", name: "hero_subhead_prefix", widget: "text" }
          - { label: "Hero subhead (glow ending)", name: "hero_subhead_glow", widget: "string" }
          - { label: "Hero button label", name: "hero_cta_label", widget: "string" }
          - { label: "Hero button link", name: "hero_cta_link", widget: "string" }

          - { label: "\"Distinct offering\" eyebrow", name: "distinct_eyebrow", widget: "string" }
          - label: "\"Distinct offering\" headline"
            name: "distinct_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "\"Distinct offering\" body", name: "distinct_body", widget: "text" }

          - { label: "Phases eyebrow", name: "phases_eyebrow", widget: "string" }
          - label: "The four phases, for founders"
            name: "phases"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Apply tag", name: "apply_tag", widget: "string" }
          - { label: "Apply headline", name: "apply_headline", widget: "string" }
          - { label: "Apply body", name: "apply_body", widget: "text" }
          - { label: "Apply button label", name: "apply_cta_label", widget: "string" }
          - { label: "Apply button link", name: "apply_cta_link", widget: "string" }

      - name: "think"
        label: "Think (R.A.T.™)"
        file: "content/think.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }

          - { label: "Trilogy eyebrow", name: "trilogy_eyebrow", widget: "string" }
          - { label: "Trilogy headline", name: "trilogy_headline", widget: "string" }
          - { label: "Trilogy body", name: "trilogy_body", widget: "text" }

          - { label: "Metacognitive eyebrow", name: "meta_eyebrow", widget: "string" }
          - { label: "Metacognitive headline", name: "meta_headline", widget: "string" }
          - { label: "Metacognitive body", name: "meta_body", widget: "text" }

          - { label: "Intelligence Infrastructure eyebrow", name: "intel_eyebrow", widget: "string" }
          - { label: "Intelligence Infrastructure headline", name: "intel_headline", widget: "string" }
          - { label: "Intelligence Infrastructure body", name: "intel_body", widget: "text" }
          - label: "Domains it connects to"
            name: "intel_domains"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Word", name: "label", widget: "string" }

          - { label: "Closing eyebrow", name: "closing_eyebrow", widget: "string" }
          - { label: "Closing headline", name: "closing_headline", widget: "string" }

      - name: "journal"
        label: "The Journal"
        file: "content/journal.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }

          - { label: "Arc eyebrow", name: "arc_eyebrow", widget: "string" }
          - label: "Arc steps"
            name: "arc_steps"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Entries eyebrow", name: "entries_eyebrow", widget: "string" }
          - label: "Recent entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Closing eyebrow", name: "closing_eyebrow", widget: "string" }
          - { label: "Closing headline", name: "closing_headline", widget: "string" }

      - name: "products"
        label: "The .LLab"
        file: "content/products.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }

          - { label: "Membership eyebrow", name: "membership_eyebrow", widget: "string" }
          - label: "Membership headline"
            name: "membership_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Membership body", name: "membership_body", widget: "text" }
          - label: "Membership pricing tiers"
            name: "membership_tiers"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.price}}"
            fields:
              - { label: "Tier name", name: "tag", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - { label: "Membership button label", name: "membership_cta_label", widget: "string" }
          - { label: "Membership button link", name: "membership_cta_link", widget: "string" }

          - { label: "Library Card eyebrow", name: "library_eyebrow", widget: "string" }
          - { label: "Library Card headline", name: "library_headline", widget: "string" }
          - { label: "Library Card body", name: "library_body", widget: "text" }
          - label: "Library Card pricing"
            name: "library_pricing"
            widget: "list"
            summary: "{{fields.number}} — {{fields.label}}"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - { label: "Library Card button label", name: "library_cta_label", widget: "string" }
          - { label: "Library Card button link", name: "library_cta_link", widget: "string" }

          - { label: "Roadmap eyebrow", name: "roadmap_eyebrow", widget: "string" }
          - { label: "Roadmap headline", name: "roadmap_headline", widget: "string" }
          - { label: "Roadmap body", name: "roadmap_body", widget: "text" }
          - { label: "Roadmap button label", name: "roadmap_cta_label", widget: "string" }
          - { label: "Roadmap button link", name: "roadmap_cta_link", widget: "string" }

          - { label: "Wider ecosystem eyebrow", name: "ecosystem_eyebrow", widget: "string" }
          - label: "Wider ecosystem products"
            name: "ecosystem_products"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Pillars eyebrow", name: "pillars_eyebrow", widget: "string" }
          - label: "Pillars"
            name: "pillars"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Closing eyebrow", name: "closing_eyebrow", widget: "string" }
          - { label: "Closing headline", name: "closing_headline", widget: "string" }
          - { label: "Closing body", name: "closing_body", widget: "text" }

      - name: "about"
        label: "About"
        file: "content/about.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }

          - { label: "Mission eyebrow", name: "mission_eyebrow", widget: "string" }
          - label: "Mission quote"
            name: "mission_quote"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Vision eyebrow", name: "vision_eyebrow", widget: "string" }
          - { label: "Vision body (base text)", name: "vision_body_prefix", widget: "text" }
          - { label: "Vision body (glow word)", name: "vision_body_glow", widget: "string" }

          - { label: "Core problem eyebrow", name: "problem_eyebrow", widget: "string" }
          - { label: "Core problem headline", name: "problem_headline", widget: "string" }
          - { label: "Core problem body", name: "problem_body", widget: "text" }

          - { label: "Phases eyebrow", name: "phases_eyebrow", widget: "string" }
          - label: "The four phases"
            name: "phases"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Omnidirectional Enterprise eyebrow", name: "model_eyebrow", widget: "string" }
          - { label: "Omnidirectional Enterprise headline", name: "model_headline", widget: "string" }
          - { label: "Omnidirectional Enterprise body", name: "model_body", widget: "text" }
          - label: "Audiences"
            name: "audiences"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - { label: "IP ecosystem eyebrow", name: "ip_eyebrow", widget: "string" }
          - { label: "IP ecosystem headline", name: "ip_headline", widget: "string" }
