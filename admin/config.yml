          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }

          - { label: "Fall teaser tag", name: "teaser_tag", widget: "string" }
          - { label: "Fall teaser headline", name: "teaser_headline", widget: "string" }
          - { label: "Fall teaser body", name: "teaser_body", widget: "text" }

          - { label: "Subscribe eyebrow", name: "subscribe_eyebrow", widget: "string" }
          - { label: "Subscribe headline", name: "subscribe_headline", widget: "string" }
          - { label: "Subscribe body", name: "subscribe_body", widget: "text" }
          - { label: "Subscribe tag", name: "subscribe_tag", widget: "string" }
          - { label: "Subscribe price", name: "subscribe_price", widget: "string" }
          - { label: "Subscribe Stripe link", name: "subscribe_link", widget: "string" }

          - { label: "Arc eyebrow", name: "arc_eyebrow", widget: "string" }
          - label: "Arc steps"
            name: "arc_steps"
            widget: "list"
            summary: "{{fields.title}}"
            fields: *title_description_fields

          - { label: "Entries eyebrow", name: "entries_eyebrow", widget: "string" }
          - label: "Recent entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Closing eyebrow", name: "closing_eyebrow", widget: "string" }
          - { label: "Closing headline", name: "closing_headline", widget: "string" }

      - name: "products"
        label: "The .LLab"
        file: "content/products.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Hero subhead", name: "hero_subhead", widget: "text" }
          - { label: "Prototype notice", name: "prototype_notice", widget: "string" }

          - { label: "Membership eyebrow", name: "membership_eyebrow", widget: "string" }
          - label: "Membership headline"
