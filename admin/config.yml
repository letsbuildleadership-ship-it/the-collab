              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - { label: "IP ecosystem eyebrow", name: "ip_eyebrow", widget: "string" }
          - { label: "IP ecosystem headline", name: "ip_headline", widget: "string" }
          - { label: "IP ecosystem body", name: "ip_body", widget: "text" }

          - { label: "Brand personality eyebrow", name: "personality_eyebrow", widget: "string" }
          - label: "Brand personality headline"
