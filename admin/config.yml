              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Stripe checkout link", name: "link", widget: "string" }

          - { label: "Library Card eyebrow", name: "library_eyebrow", widget: "string" }
          - label: "Library Card headline"
            name: "library_headline"
            widget: "list"
            summary: "{{fields.text}}"
            fields: *headline_segment_fields
          - { label: "Library Card status badge", name: "library_status", widget: "string" }
          - { label: "Library Card body", name: "library_body", widget: "text" }
          - label: "Library Card pricing tiers"
            name: "library_tiers"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.price}}"
            fields:
              - { label: "Tier name", name: "tag", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Stripe checkout link", name: "link", widget: "string" }

          - { label: "IV Phases eyebrow", name: "phases_eyebrow", widget: "string" }
          - { label: "IV Phases headline", name: "phases_headline", widget: "string" }

          - { label: "Snapshot tag", name: "snapshot_tag", widget: "string" }
          - { label: "Snapshot title", name: "snapshot_title", widget: "string" }
          - { label: "Snapshot description", name: "snapshot_description", widget: "text" }

          - label: "IV Phases products"
            name: "phase_products"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Phase tag", name: "phase", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Stripe checkout link", name: "link", widget: "string" }

          - { label: "Tax notice", name: "tax_notice", widget: "string" }

          - { label: "Creator Infrastructure eyebrow", name: "creator_eyebrow", widget: "string" }
          - { label: "Creator Infrastructure headline", name: "creator_headline", widget: "string" }
          - { label: "Creator Infrastructure body", name: "creator_body", widget: "text" }
          - label: "Creator Infrastructure teaser tags"
            name: "creator_teasers"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Word", name: "label", widget: "string" }

      - name: "about"
        label: "About"
        file: "content/about.json"
        fields:
          - { label: "Hero eyebrow", name: "eyebrow", widget: "string" }
          - label: "Hero headline"
            name: "hero_headline"
            widget: "list"
